server {
    listen 31.220.96.150:80;
    server_name angel.darceesellers.com;

    # ANGEL-09 — expose ONLY the Alexa wellness route; 404 everything else.
    location = /guardian/alexa/wellness {
        proxy_pass http://127.0.0.1:8101/guardian/alexa/wellness;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
