<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: Letter portrait; margin: 0.6in; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "DejaVu Sans", Arial, sans-serif;
    color: #2b2b2b;
    background: #fffdf6;
    text-align: center;
  }
  .frame {
    border: 10px solid #d4a017;
    border-radius: 28px;
    padding: 40px 34px 46px;
    min-height: 9.2in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #fffdf6;
  }
  .heart { font-size: 70px; color: #d4a017; line-height: 1; }
  h1 { font-size: 60px; color: #b5860b; letter-spacing: 1px; margin: 6px 0 2px; }
  .sub { font-size: 27px; color: #6b6b6b; margin-bottom: 8px; }
  .lead { font-size: 31px; font-weight: bold; margin: 18px 0 6px; }

  .card {
    border-radius: 22px;
    padding: 26px 24px;
    margin: 20px 6px;
    border: 4px solid;
  }
  .ok  { background: #eafaef; border-color: #2e9e54; }
  .call{ background: #eaf3fb; border-color: #2f74c0; }

  .mark { font-size: 52px; line-height: 1; margin-bottom: 8px; }
  .ok .mark   { color: #2e9e54; }
  .call .mark { color: #2f74c0; }

  .label { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
  .ok .label   { color: #1f7a3f; }
  .call .label { color: #235a99; }

  .say {
    font-size: 33px;
    font-weight: bold;
    color: #1c1c1c;
    line-height: 1.35;
  }
  .quote { color: #d4a017; }

  .foot { font-size: 26px; color: #444; margin-top: 14px; line-height: 1.4; }
  .foot strong { color: #b5860b; }
</style>
</head>
<body>
  <div class="frame">

    <div>
      <div class="heart">&#9829;</div>
      <h1>Guardian Angel</h1>
      <div class="sub">How to check in &mdash; just talk to Alexa</div>
    </div>

    <div>
      <div class="lead">Say it out loud:</div>

      <div class="card ok">
        <div class="mark">&#10003;</div>
        <div class="label">To let us know you&rsquo;re okay</div>
        <div class="say"><span class="quote">&ldquo;</span>Alexa, tell Guardian&nbsp;Angel<br>I&rsquo;m okay<span class="quote">&rdquo;</span></div>
      </div>

      <div class="card call">
        <div class="mark">&#9742;</div>
        <div class="label">To ask Darcee to call you</div>
        <div class="say"><span class="quote">&ldquo;</span>Alexa, tell Guardian&nbsp;Angel<br>I need Darcee<span class="quote">&rdquo;</span></div>
      </div>
    </div>

    <div class="foot">
      Alexa will answer you back.<br>
      <strong>That&rsquo;s all you have to do!</strong>
    </div>

  </div>
</body>
</html>
